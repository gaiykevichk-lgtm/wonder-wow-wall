    # Hero background video — immutable, cached forever by both the browser
    # (long max-age + immutable) and the CDN. Range requests are supported so
    # playback can resume without re-downloading.
    location ^~ /herovideo/ {
        alias /opt/app/frontend/dist/herovideo/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            video/mp4 mp4;
            image/svg+xml svg;
        }
        autoindex off;
    }
