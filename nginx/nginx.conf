upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name wonderwowwall.ru www.wonderwowwall.ru;
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wonderwowwall.ru www.wonderwowwall.ru;

    ssl_certificate /etc/letsencrypt/live/wonderwowwall.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wonderwowwall.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 20M;

    # Let’s Encrypt may follow the HTTP redirect while validating HTTP-01.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # API → backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # panel_photos: served locally (^~ = block regex, serve from dist folder)
    # imageSrc() helper generates /uploads/panel_photos/<file>
    location ^~ /uploads/panel_photos/ {
        alias /opt/app/frontend/dist/panel_photos/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        autoindex off;
    }

    # Phase 6 — admin file uploads. Served straight from the `uploads`
    # docker volume; the backend never sees a fetch. `alias` (not
    # `root`) so URL `/uploads/PANEL_PHOTO/<uuid>.jpg` maps to
    # `/var/uploads/PANEL_PHOTO/<uuid>.jpg`. Path traversal is blocked
    # by nginx's normalisation; the storage adapter never echoes
    # client-controlled filenames into paths anyway.
    location /uploads/ {
        alias /var/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        autoindex off;
    }

    # Hero background video — immutable, cached forever by both the browser
    # (long max-age + immutable) and the CDN. Range requests are supported so
    # playback can resume without re-downloading.
    location ^~ /herovideo/ {
        alias /opt/app/frontend/dist/herovideo/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            video/mp4 mp4;
            image/svg+xml svg;
        }
        autoindex off;
    }

    # Everything else → frontend (SPA)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
