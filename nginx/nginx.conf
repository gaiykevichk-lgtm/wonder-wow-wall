upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Phase 6 — admin uploads cap at 20MB (see GLOBAL_MAX_SIZE_BYTES in
    # `backend/app/domain/media/value_objects.py`). nginx must allow at
    # least that much or the request fails BEFORE FastAPI can return a
    # nice 413 + `code: media_too_large`.
    client_max_body_size 20M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 6 — admin file uploads. Served straight from the `uploads`
    # docker volume; the backend never sees a fetch. `alias` (not
    # `root`) so URL `/uploads/PANEL_PHOTO/<uuid>.jpg` maps to
    # `/var/uploads/PANEL_PHOTO/<uuid>.jpg`. Path traversal is blocked
    # by nginx's normalisation; the storage adapter never echoes
    # client-controlled filenames into paths anyway.
    location /uploads/ {
        alias /var/uploads/;
        # Aggressive immutable cache — every URL contains a UUID, so a
        # given URL's content never changes. Re-uploads create a new
        # MediaAsset with a fresh UUID, so the old URL can stay cached.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Belt-and-suspenders: never allow directory listings even if
        # autoindex were toggled on.
        autoindex off;
    }

    # Everything else → frontend (SPA)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
