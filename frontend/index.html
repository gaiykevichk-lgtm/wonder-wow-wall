<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wonder Wow Wall — инновационный сервис отделки стен модульными пластинами. 100 000+ вариантов дизайна." />
    <meta name="theme-color" content="#4CAF50" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta property="og:site_name" content="Wonder Wow Wall" />
    <meta property="og:locale" content="ru_RU" />
    <title>Wonder Wow Wall — Стеновые панели</title>
    <script>
      // Runs synchronously BEFORE React. Picks video index on each new
      // browser session and stores in window.__heroIdx.
      (function () {
        var KEY = '__hero_idx';
        var prev = parseInt(sessionStorage.getItem(KEY) || '-1', 10);
        var next = prev < 0 ? 0 : 1 - prev;
        sessionStorage.setItem(KEY, String(next));
        window.__heroIdx = next;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
