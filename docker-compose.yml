services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Phase 6 — admin file uploads. nginx serves `/uploads/` directly
      # from the same volume the backend writes into, so we save a
      # backend round-trip per asset fetch (pure file IO is much faster
      # via nginx than via FastAPI's StaticFiles).
      - uploads:/var/uploads:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/wow_wall
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - ENV=${ENV:-development}
      # Phase 6 — admin file uploads land here. Same path mounted on
      # both `backend` (read+write) and `nginx` (read-only) so writes
      # are immediately visible to URL fetches without a copy step.
      - MEDIA_STORAGE_ROOT=/var/uploads
      - MEDIA_URL_PREFIX=/uploads
    volumes:
      - uploads:/var/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wow_wall
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
  # Phase 6 — admin-uploaded media. Lifetime is independent of any
  # individual container; nuking the postgres volume should NOT delete
  # the files (and vice-versa).
  uploads:
